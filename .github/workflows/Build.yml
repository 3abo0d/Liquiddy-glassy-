name: Build LSPosed APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Manifest, Xposed Stubs & Fix Array Index
        run: |
          mkdir -p app/src/main/java/de/robv/android/xposed/callbacks
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'
          python3 -c '
          import os
          base = "app/src/main/java/de/robv/android/xposed"
          open(f"{base}/callbacks/XC_LoadPackage.java", "w").write("package de.robv.android.xposed.callbacks;\npublic class XC_LoadPackage { public static class LoadPackageParam { public String packageName; public ClassLoader classLoader; } }\n")
          open(f"{base}/IXposedHookLoadPackage.java", "w").write("package de.robv.android.xposed;\nimport de.robv.android.xposed.callbacks.XC_LoadPackage;\npublic interface IXposedHookLoadPackage { void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable; }\n")
          open(f"{base}/XC_MethodHook.java", "w").write("package de.robv.android.xposed;\nimport java.lang.reflect.Member;\npublic abstract class XC_MethodHook { public static class MethodHookParam { public Member method; public Object thisObject; public Object[] args; public Object result; } protected void beforeHookedMethod(MethodHookParam param) throws Throwable {} protected void afterHookedMethod(MethodHookParam param) throws Throwable {} }\n")
          open(f"{base}/XposedBridge.java", "w").write("package de.robv.android.xposed;\npublic class XposedBridge { public static void log(String text) {} public static void log(Throwable t) {} }\n")
          open(f"{base}/XposedHelpers.java", "w").write("package de.robv.android.xposed;\npublic class XposedHelpers { public static class Unhook {} public static Unhook findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return new Unhook(); } }\n")
          hook = "app/src/main/java/com/custom/liquidglass/MainHook.kt"
          if os.path.exists(hook):
              s = open(hook).read().replace("param.args as Int", "param.args[0] as Int")
              open(hook, "w").write(s)
          '
      - name: Accept Android Licenses & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLockscreen-APK
          path: app/build/outputs/apk/debug/app-debug.apk
